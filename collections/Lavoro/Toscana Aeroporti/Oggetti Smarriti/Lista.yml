info:
  name: Lista
  type: http
  seq: 1

http:
  method: GET
  url: "{{apiurl}}/lost-item?airport=FLR&categoryId=5"
  headers:
    - name: Accept
      value: application/json
    - name: User-Agent
      value: Bruno application/vnd.api+json
    - name: Ocp-Apim-Trace
      value: "true"
    - name: Ocp-Apim-Subscription-Key
      value: "{{apikey}}"
  params:
    - name: airport
      value: FLR
      type: query
    - name: categoryId
      value: "5"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
